# Ánh xạ tên style trong Word -> vai trò (role) trong hệ thống.
# - pattern: biểu thức chính quy (không phân biệt hoa thường), so khớp TOÀN BỘ tên style.
# - Quy tắc đầu tiên khớp sẽ được dùng. Nếu style không khớp quy tắc nào,
#   hệ thống thử tiếp style cha (basedOn); cuối cùng mặc định là "body"
#   và liệt kê style đó trong báo cáo để bổ sung vào bảng ánh xạ của dự án.
# - Mỗi nhà xuất bản / dự án nên có file ánh xạ riêng (xem templates/*/style_map.yaml),
#   các quy tắc của dự án được ưu tiên trước bảng mặc định này.
- {pattern: 'toc ?\d.*|table of figures|mục lục.*', role: toc}
- {pattern: 'title|chapter ?title|ct|tiêu đề chương', role: chapter_title}
- {pattern: 'chapter ?(number|num|no\.?)|cn|số chương', role: chapter_number}
- {pattern: 'heading ?1|h1|a ?head', role: h1}
- {pattern: 'heading ?2|h2|b ?head', role: h2}
- {pattern: 'heading ?3|h3|c ?head', role: h3}
- {pattern: 'heading ?[4-9]|h[4-9]|d ?head', role: h4}
- {pattern: 'caption|fig(ure)? ?cap(tion)?|chú thích hình', role: caption}
- {pattern: 'table ?(caption|title)|tab(le)? ?cap', role: table_caption}
- {pattern: 'table ?(note|footnote|source)', role: table_note}
- {pattern: 'table ?(head|heading|header|col ?head).*', role: table_head}
- {pattern: 'table ?(text|body|grid text).*', role: table_body}
- {pattern: 'list ?bullet.*|bullet(ed)?( ?list.*)?|bl ?(\d|first|mid|last)?', role: list_bullet}
- {pattern: 'list ?number.*|numbered ?list.*|nl ?(\d|first|mid|last)?', role: list_number}
- {pattern: 'quote|intense ?quote|block ?text|extract|ext', role: quote}
- {pattern: 'box ?(title|head(ing)?)', role: box_title}
- {pattern: 'box.*|key ?points?.*|clinical ?pearls?.*', role: box}
- {pattern: 'bibliography|references?|ref|ref ?list|tài liệu tham khảo', role: reference}
- {pattern: 'footnote ?text|endnote ?text', role: footnote}
- {pattern: 'normal|body ?text.*|default|plain ?text|list ?paragraph|no ?spacing|normal ?\(web\)', role: body}
